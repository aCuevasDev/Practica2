<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUKEBOX</title>
    <link rel="stylesheet" href="styles.css">
    <script src="node_modules/howler/dist/howler.js"></script> <!-- Run npm install first -->
    <script type="module" src="index.js"></script>
</head>

<body>
    <div class="header">
        <img id="music-icon" class="icon" src="songs/covers/placeholder.svg" />
        <p>Reproductor Musical</p>
        <p>Práctica M6 - Javascript nativo + Tailwind + Howler.js</p>
    </div>

    <main>
        <div id="songList">
            <div id="songListHeader"><span>Lista de reproducción</span><span id="totalSongNumber">N canciones</span>
                <div class="sortBar">
                    <span>Order By:</span>
                    <button data-sort="name">Name</button>
                    <button data-sort="author">Author</button>
                    <button data-sort="duration">Duration</button>
                </div>
            </div>
            <div class="cards-container">
                <!-- <div class="card"> Placeholder
                    <img class="coverArt" src="" alt="Cover Art">
                    <span class="songName">nombrePlaceholder</span>
                    <span class="author">autorPlaceholder</span>
                    <span class="duration">durationPlaceholder</span>
                </div> -->
            </div>
        </div>

        <div id="playingNow">
            <img class="currentCover" src="songs/covers/placeholder.svg" alt="Cover Art" />
            <span id="currentlyPlaying" hidden>Sonando Ahora</span>
            <span class="currentSong">Ninguna canción seleccionada</span>
            <span class="currentAuthor"></span>
        </div>
        <div id="equalizer">
            <div class="eq-header">
                <h2>Ecualizador</h2>
            </div>
            <div class="spectrum"></div>
            <div class="eq-bands">
                <label class="eq-band">
                    <span>Graves</span>
                    <input type="range" class="eq-slider" data-band="0" min="-12" max="12" step="1" value="0">
                    <output class="value">0 dB</output>
                </label>
                <label class="eq-band">
                    <span>Medios</span>
                    <input type="range" class="eq-slider" data-band="1" min="-12" max="12" step="1" value="0">
                    <output class="value">0 dB</output>
                </label>
                <label class="eq-band">
                    <span>Agudos</span>
                    <input type="range" class="eq-slider" data-band="2" min="-12" max="12" step="1" value="0">
                    <output class="value">0 dB</output>
                </label>
            </div>
            <button class="reset" id="eqReset">Restablecer ecualizador</button>
        </div>
    </main>
    <div class="footer" id="player">
        <div id="progressBar">
            <span id="currentTime">0:00</span>
            <input type="range" id="progressSlider" min="0" max="100" value="0" step="0.1">
            <span id="totalTime">0:00</span>
        </div>

        <div id="currentSongInfo">
            <img class="currentCover" src="songs/covers/placeholder.svg" alt="Cover Art">
            <span class="currentSong">Ninguna canción seleccionada</span>
            <span class="currentAuthor"></span>

        </div>
        <div id="controls">
            <button id="random">🔀</button>
            <button id="prevButton">⏮️</button>
            <button id="playPauseButton">▶️</button>
            <button id="nextButton">⏭️</button>
            <button id="repeat">🔁</button>
        </div>
        <div id="volumeControl">
            <label for="volumeSlider" id="muteVolume">🔈</label>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
            <span id="volumeValue">100%</span>
        </div>
    </div>
</body>


</html>
